name: Build ColorOS Unlock Anim

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Generar proyecto del modulo
        run: |
          mkdir -p proj/app/src/main/java/com/nick/colorosunlock
          mkdir -p proj/app/src/main/assets
          mkdir -p proj/app/src/main/res/values
          cd proj

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://api.xposed.info/' }
              }
          }
          rootProject.name = 'ColorOSUnlockAnim'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.nick.colorosunlock'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.nick.colorosunlock'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              compileOnly 'de.robv.android.xposed:api:82'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="ColorOS Unlock Anim"
                  android:allowBackup="false">
                  <meta-data android:name="xposedmodule" android:value="true" />
                  <meta-data android:name="xposeddescription"
                      android:value="Animacion de entrada de iconos al desbloquear (estilo ColorOS 17)" />
                  <meta-data android:name="xposedminversion" android:value="82" />
                  <meta-data android:name="xposedscope" android:resource="@array/xposedscope" />
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/arrays.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string-array name="xposedscope">
                  <item>com.android.launcher3</item>
              </string-array>
          </resources>
          EOF

          echo "com.nick.colorosunlock.Hook" > app/src/main/assets/xposed_init

          cat > app/src/main/java/com/nick/colorosunlock/Hook.java <<'EOF'
          package com.nick.colorosunlock;

          import android.app.Activity;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.os.PowerManager;
          import android.view.View;
          import android.view.ViewGroup;
          import android.animation.ObjectAnimator;
          import android.animation.TimeInterpolator;

          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.List;
          import java.util.Map;
          import java.util.WeakHashMap;

          import de.robv.android.xposed.IXposedHookLoadPackage;
          import de.robv.android.xposed.XC_MethodHook;
          import de.robv.android.xposed.XposedBridge;
          import de.robv.android.xposed.XposedHelpers;
          import de.robv.android.xposed.callbacks.XC_LoadPackage;

          public class Hook implements IXposedHookLoadPackage {

              // ===== AJUSTES (cambia estos numeros para afinar la animacion) =====
              static final float START_SCALE = 0.5f;    // escala inicial (mas bajo = mas salto)
              static final float START_DY_DP = 80f;     // cuanto suben los iconos desde abajo
              static final long DURATION = 1100;        // duracion total del resorte en ms
              static final long ALPHA_DURATION = 280;   // duracion del fundido de entrada
              static final long STAGGER = 25;           // retraso entre icono e icono
              static final long MAX_DELAY = 500;        // retraso maximo acumulado
              static final float SPRING_FREQ = 2.5f;    // cantidad de vaivenes (mas alto = mas rebotes)
              static final float SPRING_DAMP = 5.0f;    // amortiguacion (mas bajo = rebota mas tiempo)
              // ===================================================================

              private static final Map<Activity, BroadcastReceiver> RECEIVERS = new WeakHashMap<>();
              private static volatile boolean pending = false;
              private static final Map<View, ObjectAnimator> ALPHA_ANIMS = new WeakHashMap<>();

              // Resorte amortiguado: pasa de largo y vuelve varias veces hasta asentarse
              static class Spring implements TimeInterpolator {
                  @Override
                  public float getInterpolation(float t) {
                      return (float) (1.0 - Math.exp(-SPRING_DAMP * t)
                              * Math.cos(2.0 * Math.PI * SPRING_FREQ * t));
                  }
              }

              private static void cancelAlpha(View v) {
                  ObjectAnimator o = ALPHA_ANIMS.remove(v);
                  if (o != null) o.cancel();
              }

              @Override
              public void handleLoadPackage(XC_LoadPackage.LoadPackageParam lpp) {
                  if (!"com.android.launcher3".equals(lpp.packageName)) return;
                  try {
                      Class<?> launcher = XposedHelpers.findClass(
                              "com.android.launcher3.Launcher", lpp.classLoader);

                      XposedBridge.hookAllMethods(launcher, "onCreate", new XC_MethodHook() {
                          @Override
                          protected void afterHookedMethod(MethodHookParam p) {
                              register((Activity) p.thisObject);
                          }
                      });

                      XposedBridge.hookAllMethods(launcher, "onDestroy", new XC_MethodHook() {
                          @Override
                          protected void beforeHookedMethod(MethodHookParam p) {
                              unregister((Activity) p.thisObject);
                          }
                      });

                      // Disparo temprano: el launcher recupera el foco cuando empieza el desbloqueo
                      XposedHelpers.findAndHookMethod(Activity.class, "onWindowFocusChanged",
                              boolean.class, new XC_MethodHook() {
                          @Override
                          protected void afterHookedMethod(MethodHookParam p) {
                              Activity a = (Activity) p.thisObject;
                              boolean hasFocus = (Boolean) p.args[0];
                              if (!hasFocus || !pending) return;
                              synchronized (RECEIVERS) {
                                  if (!RECEIVERS.containsKey(a)) return;
                              }
                              PowerManager pm = (PowerManager) a.getSystemService(Context.POWER_SERVICE);
                              if (pm != null && !pm.isInteractive()) return;
                              play(a);
                          }
                      });
                  } catch (Throwable t) {
                      XposedBridge.log("ColorOSUnlock: " + t);
                  }
              }

              private static void register(final Activity a) {
                  synchronized (RECEIVERS) {
                      if (RECEIVERS.containsKey(a)) return;
                      BroadcastReceiver r = new BroadcastReceiver() {
                          @Override
                          public void onReceive(Context c, Intent i) {
                              String act = i.getAction();
                              if (Intent.ACTION_SCREEN_OFF.equals(act)) {
                                  pending = true;
                                  hide(a);
                              } else if (Intent.ACTION_USER_PRESENT.equals(act)) {
                                  // respaldo por si el disparo temprano no ocurrio
                                  if (pending) play(a);
                              }
                          }
                      };
                      IntentFilter f = new IntentFilter();
                      f.addAction(Intent.ACTION_SCREEN_OFF);
                      f.addAction(Intent.ACTION_USER_PRESENT);
                      a.registerReceiver(r, f);
                      RECEIVERS.put(a, r);
                  }
              }

              private static void unregister(Activity a) {
                  synchronized (RECEIVERS) {
                      BroadcastReceiver r = RECEIVERS.remove(a);
                      if (r != null) {
                          try { a.unregisterReceiver(r); } catch (Throwable ignored) {}
                      }
                  }
              }

              private static void collect(View v, List<View> out) {
                  if (!(v instanceof ViewGroup)) return;
                  ViewGroup g = (ViewGroup) v;
                  if (g.getClass().getSimpleName().equals("ShortcutAndWidgetContainer")) {
                      for (int i = 0; i < g.getChildCount(); i++) out.add(g.getChildAt(i));
                      return;
                  }
                  for (int i = 0; i < g.getChildCount(); i++) collect(g.getChildAt(i), out);
              }

              private static List<View> getIcons(Activity a) throws Throwable {
                  List<View> icons = new ArrayList<>();
                  Object ws = XposedHelpers.callMethod(a, "getWorkspace");
                  int page = (Integer) XposedHelpers.callMethod(ws, "getCurrentPage");
                  collect((View) XposedHelpers.callMethod(ws, "getChildAt", page), icons);
                  try {
                      collect((View) XposedHelpers.callMethod(a, "getHotseat"), icons);
                  } catch (Throwable ignored) {}
                  return icons;
              }

              // Oculta los iconos al apagar la pantalla para que no se vean quietos al desbloquear
              private static void hide(Activity a) {
                  try {
                      float d = a.getResources().getDisplayMetrics().density;
                      for (View v : getIcons(a)) {
                          v.animate().cancel();
                          cancelAlpha(v);
                          v.setAlpha(0f);
                          v.setScaleX(START_SCALE);
                          v.setScaleY(START_SCALE);
                          v.setTranslationY(START_DY_DP * d);
                      }
                  } catch (Throwable t) {
                      XposedBridge.log("ColorOSUnlock hide: " + t);
                      pending = false;
                  }
              }

              private static void play(Activity a) {
                  pending = false;
                  try {
                      final List<View> icons = getIcons(a);

                      final int[] loc = new int[2];
                      final Map<View, int[]> pos = new WeakHashMap<>();
                      for (View v : icons) {
                          v.getLocationOnScreen(loc);
                          pos.put(v, new int[]{loc[0], loc[1]});
                      }
                      Collections.sort(icons, new Comparator<View>() {
                          @Override
                          public int compare(View x, View y) {
                              int[] px = pos.get(x), py = pos.get(y);
                              if (px[1] != py[1]) return px[1] - py[1];
                              return px[0] - py[0];
                          }
                      });

                      float d = a.getResources().getDisplayMetrics().density;
                      for (int i = 0; i < icons.size(); i++) {
                          final View v = icons.get(i);
                          long delay = Math.min(i * STAGGER, MAX_DELAY);
                          v.animate().cancel();
                          cancelAlpha(v);
                          v.setAlpha(0f);
                          v.setScaleX(START_SCALE);
                          v.setScaleY(START_SCALE);
                          v.setTranslationY(START_DY_DP * d);

                          // El fundido va aparte porque el alpha no puede pasarse de 1
                          ObjectAnimator fade = ObjectAnimator.ofFloat(v, View.ALPHA, 0f, 1f);
                          fade.setStartDelay(delay);
                          fade.setDuration(ALPHA_DURATION);
                          ALPHA_ANIMS.put(v, fade);
                          fade.start();

                          v.animate()
                                  .scaleX(1f)
                                  .scaleY(1f)
                                  .translationY(0f)
                                  .setStartDelay(delay)
                                  .setDuration(DURATION)
                                  .setInterpolator(new Spring())
                                  .withEndAction(new Runnable() {
                                      @Override
                                      public void run() {
                                          v.setAlpha(1f);
                                          v.setScaleX(1f);
                                          v.setScaleY(1f);
                                          v.setTranslationY(0f);
                                      }
                                  })
                                  .start();
                      }
                  } catch (Throwable t) {
                      XposedBridge.log("ColorOSUnlock play: " + t);
                  }
              }
          }
          EOF

      - name: Compilar APK
        working-directory: proj
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ColorOSUnlockAnim-apk
          path: proj/app/build/outputs/apk/debug/*.apk
