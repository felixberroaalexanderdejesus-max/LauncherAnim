name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build
        run: |
          ls -la
          unzip -o LauncherAnim.zip -d proj
          find proj -maxdepth 3 | head -40
          S=$(find proj -name settings.gradle | head -1)
          echo "Proyecto: $S"
          cd "$(dirname "$S")"
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: LauncherAnim-apk
          path: proj/**/build/outputs/apk/debug/*.apk
